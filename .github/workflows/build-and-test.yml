name: Build and Test RTE

on:
  push:
    branches:
      - development
      - development-pw
      - main
      - ngwpc-candidate
      - ngwpc-release
  pull_request:
    branches:
      - development
      - development-pw
      - main
      - ngwpc-candidate
      - ngwpc-release
  workflow_dispatch:
    inputs:
      INSTALL_DEBUGGERS:
        description: "INSTALL_DEBUGGERS"
        required: false
        type: boolean
        default: false
      NGEN_SOURCE_MODE:
        description: "NGEN_SOURCE_MODE"
        required: false
        type: string
      FORCING_BASE_REMOTE_TAG:
        description: "FORCING_BASE_REMOTE_TAG"
        required: false
        type: string
      NGEN_BASE_REMOTE_TAG:
        description: "NGEN_BASE_REMOTE_TAG"
        required: false
        type: string
      NGEN_BASE__REMOTE_GHCR_TAG:
        description: "NGEN_BASE__REMOTE_GHCR_TAG"
        required: false
        type: string
      REPO_TAG_FCST_MGR:
        description: "REPO_TAG_FCST_MGR"
        required: false
        type: string
      REPO_TAG_MSW_MGR:
        description: "REPO_TAG_MSW_MGR"
        required: false
        type: string
      REPO_TAG_CAL_MGR:
        description: "REPO_TAG_CAL_MGR"
        required: false
        type: string
      REPO_TAG_REGION_MGR:
        description: "REPO_TAG_REGION_MGR"
        required: false
        type: string
      REPO_TAG_DATA_ASSIM_ENGINE:
        description: "REPO_TAG_DATA_ASSIM_ENGINE"
        required: false
        type: string
      # NOTE: REPO_TAG_NGEN_FORCING is optional. See README.md for caveats. This does not affect all aspects of ngen-forcing, this only causes a `pip install` of the ngen-forcing Python package specifically, on top of the ngen base image, after installing manager packages.
      REPO_TAG_NGEN_FORCING:
        description: "REPO_TAG_NGEN_FORCING"
        required: false
        type: string
      REPO_TAG_EVAL:
        description: "REPO_TAG_EVAL"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  # set variables for use in other jobs
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      gh_org: ${{ steps.vars.outputs.gh_org }}
      image_base: ${{ steps.vars.outputs.image_base }}
      pr_tag: ${{ steps.vars.outputs.pr_tag }}
      commit_sha: ${{ steps.vars.outputs.commit_sha }}
      commit_sha_short: ${{ steps.vars.outputs.commit_sha_short }}
      test_image_tag: ${{ steps.vars.outputs.test_image_tag }}
      alias_tag: ${{ steps.vars.outputs.alias_tag }}
      build_date: ${{ steps.vars.outputs.build_date }}
      clean_ref: ${{ steps.vars.outputs.clean_ref }}
      ngen_source_mode: ${{ steps.vars.outputs.ngen_source_mode }}
      forcing_base_remote_tag: ${{ steps.vars.outputs.forcing_base_remote_tag }}
      ngen_base_remote_tag: ${{ steps.vars.outputs.ngen_base_remote_tag }}
      ngen_base_remote_ghcr_tag: ${{ steps.vars.outputs.ngen_base_remote_ghcr_tag }}
      install_debuggers: ${{ steps.vars.outputs.install_debuggers }}
      repo_tag_fcst_mgr: ${{ steps.vars.outputs.repo_tag_fcst_mgr }}
      repo_tag_msw_mgr: ${{ steps.vars.outputs.repo_tag_msw_mgr }}
      repo_tag_cal_mgr: ${{ steps.vars.outputs.repo_tag_cal_mgr }}
      repo_tag_region_mgr: ${{ steps.vars.outputs.repo_tag_region_mgr }}
      repo_tag_data_assim_engine: ${{ steps.vars.outputs.repo_tag_data_assim_engine }}
      # NOTE: REPO_TAG_NGEN_FORCING is optional. See README.md for caveats. This does not affect all aspects of ngen-forcing, this only causes a `pip install` of the ngen-forcing Python package specifically, on top of the ngen base image, after installing manager packages.
      repo_tag_ngen_forcing: ${{ steps.vars.outputs.repo_tag_ngen_forcing }}
      repo_tag_eval: ${{ steps.vars.outputs.repo_tag_eval }}
    steps:
      - name: Compute image vars
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          # set variables to use with Docker images
          GH_ORG="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO="$(basename "${GITHUB_REPOSITORY}")"
          IMAGE_BASE="${REGISTRY}/${GH_ORG}/${REPO}"

          # one datetime for all time variables
          NOW=$(date -u +'%Y-%m-%d %H:%M:%S')

          # for OCI labels
          BUILD_DATE=$(date -u -d "$NOW" +'%Y-%m-%dT%H:%M:%SZ')

          # for Docker image tags
          TIMESTAMP=$(date -u -d "$NOW" +'%Y%m%d%H%M%SZ')

          # logic to get the real branch name and commit SHA on pull requests
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            REAL_REF="${{ github.head_ref }}"
            REAL_SHA="${{ github.event.pull_request.head.sha }}"
          else
            REAL_REF="${{ github.ref_name }}"
            REAL_SHA="${GITHUB_SHA}"
          fi

          # clean ref name and short commit sha
          CLEAN_REF=$(echo "$REAL_REF" | tr '[:upper:]' '[:lower:]' | sed 's/\//-/g')
          SHORT_SHA="${REAL_SHA:0:7}"

          # lane-aware defaults: a run on development-pw defaults to pw-lane artifacts,
          # a run on development behaves exactly as before. Explicit inputs always win.
          # The lane ref is the PR target branch on pull requests, else the pushed/dispatched branch.
          LANE_REF="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
          if [ "$LANE_REF" = "development-pw" ]; then
            DEFAULT_REF="development-pw"
            DEFAULT_BASE_TAG="latest-pw"
          else
            DEFAULT_REF="development"
            DEFAULT_BASE_TAG="latest"
          fi

          # set input variables for optional workflow_dispatch parameters with lane defaults if not provided
          NGEN_SOURCE_MODE="${{ inputs.NGEN_SOURCE_MODE || 'ghcr' }}"
          FORCING_BASE_REMOTE_TAG="${{ inputs.FORCING_BASE_REMOTE_TAG }}"
          FORCING_BASE_REMOTE_TAG="${FORCING_BASE_REMOTE_TAG:-$DEFAULT_REF}"
          NGEN_BASE_REMOTE_TAG="${{ inputs.NGEN_BASE_REMOTE_TAG }}"
          NGEN_BASE_REMOTE_TAG="${NGEN_BASE_REMOTE_TAG:-$DEFAULT_REF}"
          NGEN_BASE__REMOTE_GHCR_TAG="${{ inputs.NGEN_BASE__REMOTE_GHCR_TAG }}"
          NGEN_BASE__REMOTE_GHCR_TAG="${NGEN_BASE__REMOTE_GHCR_TAG:-$DEFAULT_BASE_TAG}"
          REPO_TAG_FCST_MGR="${{ inputs.REPO_TAG_FCST_MGR }}"
          REPO_TAG_FCST_MGR="${REPO_TAG_FCST_MGR:-$DEFAULT_REF}"
          REPO_TAG_MSW_MGR="${{ inputs.REPO_TAG_MSW_MGR }}"
          REPO_TAG_MSW_MGR="${REPO_TAG_MSW_MGR:-$DEFAULT_REF}"
          REPO_TAG_CAL_MGR="${{ inputs.REPO_TAG_CAL_MGR }}"
          REPO_TAG_CAL_MGR="${REPO_TAG_CAL_MGR:-$DEFAULT_REF}"
          REPO_TAG_REGION_MGR="${{ inputs.REPO_TAG_REGION_MGR }}"
          REPO_TAG_REGION_MGR="${REPO_TAG_REGION_MGR:-$DEFAULT_REF}"
          REPO_TAG_DATA_ASSIM_ENGINE="${{ inputs.REPO_TAG_DATA_ASSIM_ENGINE }}"
          REPO_TAG_DATA_ASSIM_ENGINE="${REPO_TAG_DATA_ASSIM_ENGINE:-$DEFAULT_REF}"
          # NOTE: REPO_TAG_NGEN_FORCING is optional. See README.md for caveats. This does not affect all aspects of ngen-forcing, this only causes a `pip install` of the ngen-forcing Python package specifically, on top of the ngen base image, after installing manager packages.
          REPO_TAG_NGEN_FORCING="${{ inputs.REPO_TAG_NGEN_FORCING }}"
          REPO_TAG_NGEN_FORCING="${REPO_TAG_NGEN_FORCING:-$DEFAULT_REF}"
          REPO_TAG_EVAL="${{ inputs.REPO_TAG_EVAL }}"
          REPO_TAG_EVAL="${REPO_TAG_EVAL:-$DEFAULT_REF}"

          # INSTALL_DEBUGGERS is a boolean input, convert to "YES"/"NO" string for use in build args
          if [ "${{ inputs.INSTALL_DEBUGGERS }}" = "true" ]; then
            INSTALL_DEBUGGERS="YES"
          else
            INSTALL_DEBUGGERS="NO"
          fi

          # logic for the tags:
          # test_image_tag (commit short sha): used for the initial build and test
          # alias_tag: used for final tagging on successful tests

          # test tag is always commit short sha
          TEST_TAG="${SHORT_SHA}"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # for pull requests, use pr-<pr number>-build
            ALIAS="pr-${{ github.event.pull_request.number }}-build"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            # for manual workflow dispatch on tags, use the git tag
            ALIAS="${CLEAN_REF}"
          else
            # for pushes to branches, use timestamp-branchname
            ALIAS="${TIMESTAMP}-${CLEAN_REF}"
          fi

          # save outputs
          echo "gh_org=${GH_ORG}" >> "$GITHUB_OUTPUT"
          echo "image_base=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "test_image_tag=${TEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "alias_tag=${ALIAS}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${REAL_SHA}" >> "$GITHUB_OUTPUT"
          echo "commit_sha_short=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "clean_ref=${CLEAN_REF}" >> "$GITHUB_OUTPUT"
          echo "ngen_source_mode=${NGEN_SOURCE_MODE}" >> "$GITHUB_OUTPUT"
          echo "forcing_base_remote_tag=${FORCING_BASE_REMOTE_TAG}" >> "$GITHUB_OUTPUT"
          echo "ngen_base_remote_tag=${NGEN_BASE_REMOTE_TAG}" >> "$GITHUB_OUTPUT"
          echo "ngen_base_remote_ghcr_tag=${NGEN_BASE__REMOTE_GHCR_TAG}" >> "$GITHUB_OUTPUT"
          echo "install_debuggers=${INSTALL_DEBUGGERS}" >> "$GITHUB_OUTPUT"
          echo "repo_tag_fcst_mgr=${REPO_TAG_FCST_MGR}" >> "$GITHUB_OUTPUT"
          echo "repo_tag_msw_mgr=${REPO_TAG_MSW_MGR}" >> "$GITHUB_OUTPUT"
          echo "repo_tag_cal_mgr=${REPO_TAG_CAL_MGR}" >> "$GITHUB_OUTPUT"
          echo "repo_tag_region_mgr=${REPO_TAG_REGION_MGR}" >> "$GITHUB_OUTPUT"
          echo "repo_tag_data_assim_engine=${REPO_TAG_DATA_ASSIM_ENGINE}" >> "$GITHUB_OUTPUT"
          # NOTE: REPO_TAG_NGEN_FORCING is optional. See README.md for caveats. This does not affect all aspects of ngen-forcing, this only causes a `pip install` of the ngen-forcing Python package specifically, on top of the ngen base image, after installing manager packages.
          echo "repo_tag_ngen_forcing=${REPO_TAG_NGEN_FORCING}" >> "$GITHUB_OUTPUT"
          echo "repo_tag_eval=${REPO_TAG_EVAL}" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: build and test
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs:
      - setup
    steps:
      - name: Free Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # remove heavy pre-installed tools
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo docker image prune --all --force

          # clean up Docker system and images
          echo "Disk space after cleanup:"
          df -h
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Clone required repositories
        run: ./setup_clone_repos.sh https shallow
      - name: Build RTE image
        env:
          TARGET_IMAGE_NAME: ${{needs.setup.outputs.image_base}}:${{ needs.setup.outputs.test_image_tag }}
          TARGET_IMAGE_SOURCE: https://github.com/${{ github.repository }}
          TARGET_IMAGE_VENDOR: ${{ github.repository_owner }}
          TARGET_IMAGE_VERSION: ${{ needs.setup.outputs.clean_ref }}
          TARGET_IMAGE_REVISION: ${{ needs.setup.outputs.commit_sha }}
          TARGET_IMAGE_CREATED: ${{ needs.setup.outputs.build_date }}
          NGEN_SOURCE_MODE: ${{ needs.setup.outputs.ngen_source_mode }}
          FORCING_BASE_REMOTE_TAG: ${{ needs.setup.outputs.forcing_base_remote_tag }}
          NGEN_BASE_REMOTE_TAG: ${{ needs.setup.outputs.ngen_base_remote_tag }}
          NGEN_BASE__REMOTE_GHCR_TAG: ${{ needs.setup.outputs.ngen_base_remote_ghcr_tag }}
          INSTALL_DEBUGGERS: ${{ needs.setup.outputs.install_debuggers }}
          REPO_TAG_FCST_MGR: ${{ needs.setup.outputs.repo_tag_fcst_mgr }}
          REPO_TAG_MSW_MGR: ${{ needs.setup.outputs.repo_tag_msw_mgr }}
          REPO_TAG_CAL_MGR: ${{ needs.setup.outputs.repo_tag_cal_mgr }}
          REPO_TAG_REGION_MGR: ${{ needs.setup.outputs.repo_tag_region_mgr }}
          REPO_TAG_DATA_ASSIM_ENGINE: ${{ needs.setup.outputs.repo_tag_data_assim_engine }}
          # NOTE: REPO_TAG_NGEN_FORCING is optional. See README.md for caveats. This does not affect all aspects of ngen-forcing, this only causes a `pip install` of the ngen-forcing Python package specifically, on top of the ngen base image, after installing manager packages.
          REPO_TAG_NGEN_FORCING: ${{ needs.setup.outputs.repo_tag_ngen_forcing }}
          REPO_TAG_EVAL: ${{ needs.setup.outputs.repo_tag_eval }}
        run: |
          # Create a temporary parent directory structure for the build context
          # The Dockerfile expects to COPY from nwm-rte/* so we need the repo to be in a subdirectory
          cd ..
          if [ ! -L nwm-rte ]; then
            # Create symlink so build context can find nwm-rte/
            ln -s $(basename "$GITHUB_WORKSPACE") nwm-rte
          fi
          cd nwm-rte
          ./ngen_rte_build.sh
      - name: Log in to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push RTE image
        run: |
          docker push "${{ needs.setup.outputs.image_base }}:${{ needs.setup.outputs.test_image_tag }}"
      - name: Check remaining space
        if: always()
        run: df -h
      - name: Create minimal test directories
        run: |
          # Source config to get RUN_NGEN_ROOT__HOST
          source config.bashrc
          # Create minimal directory structure needed for noop mode
          mkdir -p "${RUN_NGEN_ROOT__HOST}/data/esmf_mesh"
          mkdir -p "${RUN_NGEN_ROOT__HOST}/data/scratch"
          mkdir -p docker_logs/run

      - name: Run RTE in noop mode
        env:
          TARGET_IMAGE_NAME: ${{needs.setup.outputs.image_base}}:${{ needs.setup.outputs.test_image_tag }}
        run: |
          # Source the script to get docker_run function and config
          source ./run.sh
          # Call docker_run with --noop flag
          docker_run python -um "ngen_rte.tests.run_tests" --noop

      - name: Run RTE pytest
        env:
          TARGET_IMAGE_NAME: ${{needs.setup.outputs.image_base}}:${{ needs.setup.outputs.test_image_tag }}
        run: |
          ./run_pytest_external.sh

  # run container security scan using Trivy
  container-scanning:
    name: container-scanning
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs:
      - setup
      - build-and-test
    steps:
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          cache: true
          version: v0.69.3
      - name: Trivy scan
        env:
          TMPDIR: /mnt/trivy-temp
        run: |
          sudo mkdir -p $TMPDIR
          sudo chown -R $USER:$USER $TMPDIR

          trivy image \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --scanners vuln \
            --ignore-unfixed \
            --timeout 45m \
            ${{ needs.setup.outputs.image_base }}:${{ needs.setup.outputs.test_image_tag }}

  # promote Docker image tags after successful tests
  promote-tags:
    name: Promote Tags
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs:
      - setup
      - build-and-test
      - container-scanning
    steps:
      - name: Tag image with alias and latest
        shell: bash
        run: |
          set -euo pipefail

          # ensure skopeo is available for promotion
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends skopeo
          fi

          IMAGE_BASE="${{ needs.setup.outputs.image_base }}"
          TEST_TAG="${{ needs.setup.outputs.test_image_tag }}"
          ALIAS_TAG="${{ needs.setup.outputs.alias_tag }}"

          # apply the primary alias (pr tag or timestamp-branch)
          skopeo copy \
            --src-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --all \
            "docker://${IMAGE_BASE}:${TEST_TAG}" "docker://${IMAGE_BASE}:${ALIAS_TAG}"

          # promotion is branch-keyed: development -> latest, development-pw -> latest-pw.
          # Do not manually dispatch cross-lane (e.g. pw refs from a development run); the
          # alias would be promoted under the wrong lane.
          if [ "$GITHUB_REF_NAME" = "development" ]; then
            skopeo copy \
              --src-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
              --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
              --all \
              "docker://${IMAGE_BASE}:${TEST_TAG}" "docker://${IMAGE_BASE}:latest"
          elif [ "$GITHUB_REF_NAME" = "development-pw" ]; then
            skopeo copy \
              --src-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
              --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
              --all \
              "docker://${IMAGE_BASE}:${TEST_TAG}" "docker://${IMAGE_BASE}:latest-pw"
          fi
